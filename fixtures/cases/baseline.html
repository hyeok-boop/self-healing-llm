<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>지역 선택 · case fixtures</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.1rem; }
    .card, .region-btn {
      display: flex; align-items: center; justify-content: space-between;
      height: 96px; margin-bottom: 12px; padding: 0 20px;
      border-radius: 16px; border: 1px solid #e2e8f0;
      background: linear-gradient(90deg, #1e293b, #64748b); color: #fff;
      font-weight: 700; font-size: 18px; cursor: pointer; text-decoration: none;
    }
    #result { margin-top: 24px; color: #0f766e; font-weight: 600; }
  </style>
</head>
<body>
  <h1>지역을 선택해 주세요</h1>
  <a class="card" id="region-tokyo" data-testid="region-tokyo" href="#tokyo">도쿄</a>
  <a class="card" id="region-osaka" data-testid="region-osaka" href="#osaka">오사카</a>
  <p id="result" hidden>선택됨: <span id="selected"></span></p>
  <script>
    document.querySelectorAll('a').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('result').hidden = false;
        document.getElementById('selected').textContent = el.textContent.trim();
      });
    });
  </script>
</body>
</html>
